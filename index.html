<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Coming Soon - Dolliest</title>
    <meta name="description" content="Something beautiful is coming. Stay tuned for a shopping experience at Dolliest." />
    <meta property="og:title" content="Coming Soon - Dollies" />
    <meta property="og:description" content="Something beautiful is coming. Stay tuned for a shopping experience." />
    <meta property="og:type" content="website" />

    <!-- Shopify font loading - replace these with your uploaded font assets -->
    <style>
        @font-face {
            font-family: 'Bodoni Moda';
            src: url('{{ "bodoni-moda-regular.woff2" | asset_url }}') format('woff2'),
                 url('{{ "bodoni-moda-regular.woff" | asset_url }}') format('woff');
            font-weight: 400;
            font-display: swap;
        }

        @font-face {
            font-family: 'Bodoni Moda';
            src: url('{{ "bodoni-moda-bold.woff2" | asset_url }}') format('woff2'),
                 url('{{ "bodoni-moda-bold.woff" | asset_url }}') format('woff');
            font-weight: 700;
            font-display: swap;
        }

        @font-face {
            font-family: 'Inter';
            src: url('{{ "inter-regular.woff2" | asset_url }}') format('woff2'),
                 url('{{ "inter-regular.woff" | asset_url }}') format('woff');
            font-weight: 400;
            font-display: swap;
        }

        @font-face {
            font-family: 'Inter';
            src: url('{{ "inter-medium.woff2" | asset_url }}') format('woff2'),
                 url('{{ "inter-medium.woff" | asset_url }}') format('woff');
            font-weight: 500;
            font-display: swap;
        }

        /* Reset and base styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Custom CSS Variables */
        :root {
            --pink-rose: #e91e63;
            --pink-deep: #ad1457;
            --elegant-black: #1a1a1a;
        }

        /* Main container starts with white background */
        .container {
            height: 100vh;
            position: relative;
            overflow: hidden;
            background: white;
        }

        /* Striped background pattern (for curtains) - Desktop: 12 stripes each color = 24 total */
        .striped-pattern {
            background: repeating-linear-gradient(
                90deg,
                #ffb3cf 0%,
                #ffb3cf 4.17%,
                #ffd4e0 4.17%,
                #ffd4e0 8.33%,
                #ffb3cf 8.33%,
                #ffb3cf 12.5%,
                #ffd4e0 12.5%,
                #ffd4e0 16.67%,
                #ffb3cf 16.67%,
                #ffb3cf 20.83%,
                #ffd4e0 20.83%,
                #ffd4e0 25%,
                #ffb3cf 25%,
                #ffb3cf 29.17%,
                #ffd4e0 29.17%,
                #ffd4e0 33.33%,
                #ffb3cf 33.33%,
                #ffb3cf 37.5%,
                #ffd4e0 37.5%,
                #ffd4e0 41.67%,
                #ffb3cf 41.67%,
                #ffb3cf 45.83%,
                #ffd4e0 45.83%,
                #ffd4e0 50%,
                #ffb3cf 50%,
                #ffb3cf 54.17%,
                #ffd4e0 54.17%,
                #ffd4e0 58.33%,
                #ffb3cf 58.33%,
                #ffb3cf 62.5%,
                #ffd4e0 62.5%,
                #ffd4e0 66.67%,
                #ffb3cf 66.67%,
                #ffb3cf 70.83%,
                #ffd4e0 70.83%,
                #ffd4e0 75%,
                #ffb3cf 75%,
                #ffb3cf 79.17%,
                #ffd4e0 79.17%,
                #ffd4e0 83.33%,
                #ffb3cf 83.33%,
                #ffb3cf 87.5%,
                #ffd4e0 87.5%,
                #ffd4e0 91.67%,
                #ffb3cf 91.67%,
                #ffb3cf 95.83%,
                #ffd4e0 95.83%,
                #ffd4e0 100%
            );
            position: relative;
        }

        /* Add elegant fabric texture overlay */
        .striped-pattern::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(circle at 25% 25%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 75% 75%, rgba(255, 255, 255, 0.08) 0%, transparent 50%),
                linear-gradient(45deg, rgba(255, 255, 255, 0.02) 25%, transparent 25%),
                linear-gradient(-45deg, rgba(255, 255, 255, 0.02) 25%, transparent 25%);
            background-size: 200px 200px, 150px 150px, 20px 20px, 20px 20px;
            pointer-events: none;
        }

        /* Enhanced curtain animations - completely smooth */
        .curtain-left {
            position: absolute;
            top: 0;
            left: 0;
            width: 50%;
            height: 100%;
            opacity: 0;
            transform: translateX(-100%);
            animation: curtainSlideInLeft 2s ease-out 0.5s forwards;
            z-index: 5;
            box-shadow: 12px 0 24px rgba(233, 30, 99, 0.15);
            filter: drop-shadow(8px 0 16px rgba(233, 30, 99, 0.1));
        }

        .curtain-right {
            position: absolute;
            top: 0;
            right: 0;
            width: 50%;
            height: 100%;
            opacity: 0;
            transform: translateX(100%);
            animation: curtainSlideInRight 2s ease-out 0.5s forwards;
            z-index: 5;
            box-shadow: -12px 0 24px rgba(233, 30, 99, 0.15);
            filter: drop-shadow(-8px 0 16px rgba(233, 30, 99, 0.1));
        }

        /* Add shadow fade animation */
        .curtain-left {
            animation: curtainSlideInLeft 2s ease-out 0.5s forwards,
                      curtainShadowFadeLeft 1.5s ease-out 2.5s forwards;
        }

        .curtain-right {
            animation: curtainSlideInRight 2s ease-out 0.5s forwards,
                      curtainShadowFadeRight 1.5s ease-out 2.5s forwards;
        }

        /* Add subtle wave effect to curtains */
        .curtain-left::after,
        .curtain-right::after {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            width: 8px;
            background: linear-gradient(
                to bottom,
                rgba(255, 255, 255, 0.3) 0%,
                rgba(255, 255, 255, 0.1) 50%,
                rgba(255, 255, 255, 0.3) 100%
            );
            animation: curtainShimmer 3s ease-in-out infinite;
        }

        .curtain-left::after {
            right: 0;
        }

        .curtain-right::after {
            left: 0;
        }

        @keyframes curtainSlideInLeft {
            0% {
                opacity: 0;
                transform: translateX(-100%);
            }
            1% {
                opacity: 1;
            }
            100% {
                opacity: 1;
                transform: translateX(0%);
            }
        }

        @keyframes curtainSlideInRight {
            0% {
                opacity: 0;
                transform: translateX(100%);
            }
            1% {
                opacity: 1;
            }
            100% {
                opacity: 1;
                transform: translateX(0%);
            }
        }

        @keyframes curtainShadowFadeLeft {
            0% {
                box-shadow: 12px 0 24px rgba(233, 30, 99, 0.15);
                filter: drop-shadow(8px 0 16px rgba(233, 30, 99, 0.1));
            }
            100% {
                box-shadow: 4px 0 8px rgba(233, 30, 99, 0.03);
                filter: drop-shadow(2px 0 4px rgba(233, 30, 99, 0.02));
            }
        }

        @keyframes curtainShadowFadeRight {
            0% {
                box-shadow: -12px 0 24px rgba(233, 30, 99, 0.15);
                filter: drop-shadow(-8px 0 16px rgba(233, 30, 99, 0.1));
            }
            100% {
                box-shadow: -4px 0 8px rgba(233, 30, 99, 0.03);
                filter: drop-shadow(-2px 0 4px rgba(233, 30, 99, 0.02));
            }
        }

        @keyframes curtainShimmer {
            0%, 100% {
                opacity: 0.3;
                transform: scaleY(1);
            }
            50% {
                opacity: 0.8;
                transform: scaleY(1.02);
            }
        }

        /* Decorative blur elements */
        .blur-1 {
            position: absolute;
            top: 25%;
            left: 25%;
            width: 24rem;
            height: 24rem;
            border-radius: 50%;
            background-color: #ffb3cf;
            filter: blur(60px);
            opacity: 0.05;
        }

        .blur-2 {
            position: absolute;
            bottom: 25%;
            right: 25%;
            width: 20rem;
            height: 20rem;
            border-radius: 50%;
            background-color: #ffd4e0;
            filter: blur(60px);
            opacity: 0.05;
        }

        /* Main content layout */
        .main-content {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 10;
        }

        .bubble-field {
            position: fixed;
            inset: 0;
            z-index: 8;
            pointer-events: none;
            opacity: 0;
            animation: foregroundReveal 0.9s ease-out 2.65s forwards;
        }

        .float-bubble {
            position: absolute;
            display: block;
            width: var(--size);
            height: var(--size);
            left: var(--left);
            top: var(--top);
            border-radius: 50%;
            background:
                radial-gradient(circle at 31% 24%, rgba(255, 255, 255, 0.98) 0 8%, transparent 9%),
                radial-gradient(circle at 68% 72%, rgba(255, 182, 217, 0.24), transparent 34%),
                radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.16), rgba(255, 210, 234, 0.12) 52%, rgba(255, 255, 255, 0.05));
            border: 1px solid rgba(255, 255, 255, 0.62);
            box-shadow:
                inset 6px 8px 14px rgba(255, 255, 255, 0.55),
                inset -8px -10px 16px rgba(255, 149, 202, 0.1),
                0 8px 24px rgba(255, 145, 198, 0.11);
            filter: blur(0.1px);
            opacity: var(--alpha);
            animation: bubbleDrift var(--duration) ease-in-out var(--delay) infinite alternate;
        }

        .float-bubble::after {
            content: "";
            position: absolute;
            inset: 18% 20% auto auto;
            width: 28%;
            height: 18%;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.5);
            transform: rotate(-28deg);
            filter: blur(0.4px);
        }

        .float-bubble:nth-child(1) { --size: 78px; --left: 9%; --top: 18%; --alpha: 0.42; --duration: 7.2s; --delay: -1.2s; }
        .float-bubble:nth-child(2) { --size: 42px; --left: 21%; --top: 62%; --alpha: 0.34; --duration: 6.4s; --delay: -2.8s; }
        .float-bubble:nth-child(3) { --size: 96px; --left: 80%; --top: 19%; --alpha: 0.36; --duration: 8.3s; --delay: -3.4s; }
        .float-bubble:nth-child(4) { --size: 54px; --left: 74%; --top: 68%; --alpha: 0.38; --duration: 7.8s; --delay: -1.6s; }
        .float-bubble:nth-child(5) { --size: 30px; --left: 13%; --top: 78%; --alpha: 0.3; --duration: 5.8s; --delay: -0.9s; }
        .float-bubble:nth-child(6) { --size: 64px; --left: 88%; --top: 49%; --alpha: 0.3; --duration: 6.9s; --delay: -4s; }
        .float-bubble:nth-child(7) { --size: 37px; --left: 39%; --top: 20%; --alpha: 0.26; --duration: 6.1s; --delay: -2.1s; }
        .float-bubble:nth-child(8) { --size: 48px; --left: 59%; --top: 82%; --alpha: 0.32; --duration: 7.4s; --delay: -3.1s; }

        .center-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 1rem;
        }

        .text-center {
            text-align: center;
            width: min(88vw, 540px);
            margin: 0 auto;
            padding: clamp(28px, 6vw, 48px) clamp(18px, 5vw, 46px);
            background:
                radial-gradient(circle at 28% 18%, rgba(255, 255, 255, 0.94), transparent 23%),
                radial-gradient(circle at 78% 74%, rgba(255, 190, 222, 0.2), transparent 33%),
                linear-gradient(145deg, rgba(255, 255, 255, 0.58), rgba(255, 245, 251, 0.34));
            border: 1px solid rgba(255, 255, 255, 0.62);
            border-radius: 34px;
            box-shadow:
                0 22px 56px rgba(173, 20, 87, 0.14),
                inset 0 1px 0 rgba(255, 255, 255, 0.82),
                inset 0 -18px 34px rgba(255, 183, 218, 0.12);
            backdrop-filter: blur(18px) saturate(1.08);
            -webkit-backdrop-filter: blur(18px) saturate(1.08);
            opacity: 0;
            transform: translateY(18px) scale(0.985);
            animation: foregroundReveal 0.9s cubic-bezier(0.2, 0.86, 0.24, 1) 2.65s forwards;
        }

        /* Brand logo section */
        .brand-logo {
            margin-bottom: 1.15rem;
            animation: fadeInUp 1.2s ease-out 2.2s forwards;
        }

        .logo-line {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 34px;
            padding: 0 17px;
            color: var(--pink-deep);
            font-size: 0.76rem;
            font-weight: 600;
            letter-spacing: 0.13em;
            text-transform: uppercase;
            background: rgba(255, 245, 250, 0.76);
            border: 1px solid rgba(255, 182, 207, 0.5);
            border-radius: 999px;
        }

        .logo-line::before {
            content: "shop opening soon";
        }

        /* Typography - Made thinner and more elegant */
        .coming-soon {
            font-family: 'Bodoni Moda', Georgia, serif;
            font-weight: 400;
            font-size: clamp(4rem, 9vw, 6.35rem);
            line-height: 0.9;
            margin-bottom: 0.85rem;
            letter-spacing: 0.01em;
            color: var(--elegant-black);
            animation: fadeInUp 1.2s ease-out 2.4s forwards;
        }

        .subtitle {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: clamp(1.25rem, 3vw, 1.55rem);
            color: rgba(173, 20, 87, 0.72);
            max-width: 4rem;
            margin: 0 auto;
            line-height: 1;
            animation: fadeInUp 1.2s ease-out 2.6s forwards;
        }

        /* Decorative divider */
        .divider {
            margin-top: 1.55rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            animation: fadeInUp 1.2s ease-out 2.8s forwards;
        }

        .divider-line {
            width: min(5rem, 22vw);
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(233, 30, 99, 0.55), transparent);
        }

        .divider-dot {
            width: auto;
            height: auto;
            border-radius: 50%;
            margin: 0;
            background: transparent;
            color: var(--pink-deep);
            font-size: 0.92rem;
        }

        .divider-dot::before {
            content: "Dolliest.com is open to offers";
        }

        /* Footer section */
        .footer {
            width: 100%;
            padding: 1rem clamp(0.75rem, 3vw, 1.5rem);
            position: relative;
            z-index: 80;
            opacity: 0;
            transform: translateY(18px) scale(0.985);
            animation: foregroundReveal 0.9s cubic-bezier(0.2, 0.86, 0.24, 1) 2.8s forwards;
        }

        .contact-card {
            width: min(100%, 440px);
            margin: 0 auto;
            text-align: center;
            background:
                radial-gradient(circle at 24% 16%, rgba(255, 255, 255, 0.9), transparent 22%),
                radial-gradient(circle at 82% 82%, rgba(255, 164, 208, 0.2), transparent 32%),
                linear-gradient(145deg, rgba(255, 255, 255, 0.58), rgba(255, 243, 250, 0.34));
            backdrop-filter: blur(18px) saturate(1.08);
            -webkit-backdrop-filter: blur(18px) saturate(1.08);
            border-radius: 999px;
            padding: 0.7rem 0.8rem 0.7rem 1.05rem;
            box-shadow:
                0 16px 34px rgba(173, 20, 87, 0.13),
                inset 0 1px 0 rgba(255, 255, 255, 0.8),
                inset 0 -12px 22px rgba(255, 183, 218, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.62);
            transition: transform 0.2s ease-out;
        }

        .contact-card:hover {
            transform: translateY(-2px);
        }

        .contact-label {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 0.7rem;
            color: rgba(106, 92, 99, 0.7);
            margin-bottom: 0;
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }

        .contact-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
        }

        .contact-text {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 0.88rem;
            font-weight: 400;
            color: rgba(26, 26, 26, 0.72);
        }

        .contact-link {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 38px;
            padding: 0 1rem;
            font-weight: 600;
            color: white;
            text-decoration: none;
            background: linear-gradient(180deg, rgba(255, 177, 214, 0.96), rgba(233, 30, 99, 0.78));
            border: 1px solid rgba(173, 20, 87, 0.18);
            border-radius: 999px;
            box-shadow: 0 6px 14px rgba(233, 30, 99, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.52);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .contact-link:hover,
        .contact-link:focus-visible {
            transform: translateY(-1px);
            box-shadow: 0 8px 18px rgba(233, 30, 99, 0.24), inset 0 1px 0 rgba(255, 255, 255, 0.58);
        }

        .contact-link:focus-visible {
            outline: 3px solid rgba(255, 182, 207, 0.4);
            outline-offset: 3px;
        }

        /* Fade in animation */
        @keyframes fadeInUp {
            from {
                transform: translateY(30px);
            }
            to {
                transform: translateY(0);
            }
        }

        @keyframes foregroundReveal {
            from {
                opacity: 0;
                transform: translateY(18px) scale(0.985);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes bubbleDrift {
            from {
                transform: translate3d(-8px, 10px, 0) scale(0.96);
            }
            to {
                transform: translate3d(10px, -18px, 0) scale(1.04);
            }
        }

        /* Responsive design */
        @media (max-width: 768px) {
            /* Mobile: Exactly 7 stripes each color = 14 total */
            .striped-pattern {
                background: repeating-linear-gradient(
                    90deg,
                    #ffb3cf 0%,
                    #ffb3cf 7.143%,
                    #ffd4e0 7.143%,
                    #ffd4e0 14.286%,
                    #ffb3cf 14.286%,
                    #ffb3cf 21.429%,
                    #ffd4e0 21.429%,
                    #ffd4e0 28.571%,
                    #ffb3cf 28.571%,
                    #ffb3cf 35.714%,
                    #ffd4e0 35.714%,
                    #ffd4e0 42.857%,
                    #ffb3cf 42.857%,
                    #ffb3cf 50%,
                    #ffd4e0 50%,
                    #ffd4e0 57.143%,
                    #ffb3cf 57.143%,
                    #ffb3cf 64.286%,
                    #ffd4e0 64.286%,
                    #ffd4e0 71.429%,
                    #ffb3cf 71.429%,
                    #ffb3cf 78.571%,
                    #ffd4e0 78.571%,
                    #ffd4e0 85.714%,
                    #ffb3cf 85.714%,
                    #ffb3cf 92.857%,
                    #ffd4e0 92.857%,
                    #ffd4e0 100%
                );
            }

            .coming-soon {
                font-size: clamp(3.6rem, 17vw, 5.2rem);
                margin-bottom: 1rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            /* Footer positioning for mobile - moved up significantly more */
            .footer {
                padding: 0 0.5rem;
                position: absolute;
                bottom: 1.5rem;
                left: 0;
                right: 0;
            }

            .contact-card {
                padding: 0.65rem;
                margin: 0 auto;
            }

            .contact-info {
                justify-content: center;
                flex-wrap: wrap;
            }

            /* Adjust curtain animations for mobile with softer shadows */
            .curtain-left {
                animation: curtainSlideInLeft 1.8s ease-out 0.5s forwards,
                          mobileCurtainShadowFadeLeft 1.5s ease-out 2.3s forwards;
                box-shadow: 8px 0 16px rgba(233, 30, 99, 0.12);
                filter: drop-shadow(6px 0 12px rgba(233, 30, 99, 0.08));
            }

            .curtain-right {
                animation: curtainSlideInRight 1.8s ease-out 0.5s forwards,
                          mobileCurtainShadowFadeRight 1.5s ease-out 2.3s forwards;
                box-shadow: -8px 0 16px rgba(233, 30, 99, 0.12);
                filter: drop-shadow(-6px 0 12px rgba(233, 30, 99, 0.08));
            }
        }

        @keyframes mobileCurtainShadowFadeLeft {
            0% {
                box-shadow: 8px 0 16px rgba(233, 30, 99, 0.12);
                filter: drop-shadow(6px 0 12px rgba(233, 30, 99, 0.08));
            }
            100% {
                box-shadow: 2px 0 6px rgba(233, 30, 99, 0.02);
                filter: drop-shadow(1px 0 3px rgba(233, 30, 99, 0.01));
            }
        }

        @keyframes mobileCurtainShadowFadeRight {
            0% {
                box-shadow: -8px 0 16px rgba(233, 30, 99, 0.12);
                filter: drop-shadow(-6px 0 12px rgba(233, 30, 99, 0.08));
            }
            100% {
                box-shadow: -2px 0 6px rgba(233, 30, 99, 0.02);
                filter: drop-shadow(-1px 0 3px rgba(233, 30, 99, 0.01));
            }
        }

        @media (max-width: 480px) {
            .coming-soon {
                font-size: clamp(3.15rem, 16vw, 4.25rem);
            }

            .blur-1, .blur-2 {
                width: 16rem;
                height: 16rem;
            }

            /* Even higher positioning for smaller phones */
            .footer {
                bottom: 2.25rem;
            }

            .text-center {
                padding: 2rem 1.05rem;
            }

            .divider {
                align-items: center;
                flex-direction: column;
                gap: 0.45rem;
            }

            .divider-line {
                width: 4.5rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.001ms !important;
                animation-delay: 0s !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.001ms !important;
            }

            .text-center,
            .footer,
            .bubble-field {
                opacity: 1 !important;
                transform: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Animated Background Curtains with striped pattern -->
        <div class="curtain-left striped-pattern"></div>
        <div class="curtain-right striped-pattern"></div>

        <!-- Decorative background elements -->

    <script>
        // Performance optimizations and hardware acceleration
        document.addEventListener('DOMContentLoaded', function() {
            const elements = document.querySelectorAll('.curtain-left, .curtain-right');
            elements.forEach(el => {
                el.style.willChange = 'transform, opacity';
                el.style.backfaceVisibility = 'hidden';
                el.style.perspective = '1000px';
                el.style.transform = 'translateZ(0)';
            });

            setTimeout(() => {
                elements.forEach(el => {
                    el.style.willChange = 'auto';
                });
            }, 5000);
        });

        const instagramLink = document.getElementById('instagram-link');
        const handleSound = document.getElementById('handle-sound');

        if (instagramLink && handleSound) {
            let lastPlay = 0;
            const playHandleSound = () => {
                const now = Date.now();
                if (now - lastPlay < 250) return;
                lastPlay = now;
                handleSound.currentTime = 0;
                handleSound.play().catch(() => {});
            };

            instagramLink.addEventListener('pointerdown', playHandleSound);
            instagramLink.addEventListener('click', playHandleSound);
        }
    </script>
