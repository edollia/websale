                margin: 0 auto;
            }

            .contact-info {
                justify-content: center;
                flex-wrap: nowrap;
                gap: 0.55rem;
            }

            .contact-text {
                font-size: 0.82rem;
            }

            .contact-link {
                min-height: 34px;
                padding: 0 0.82rem;
            }

            .float-bubble:nth-child(1) { --size: 58px; --left: 7%; }
            .float-bubble:nth-child(3) { --size: 70px; --left: 78%; }
            .float-bubble:nth-child(6) { --size: 46px; --left: 84%; }

            /* Adjust curtain animations for mobile with softer shadows */
            .curtain-left {
                animation: curtainSlideInLeft 1.8s ease-out 0.5s forwards,
                          mobileCurtainShadowFadeLeft 1.5s ease-out 2.3s forwards;
                box-shadow: 8px 0 16px rgba(233, 30, 99, 0.12);
                filter: drop-shadow(6px 0 12px rgba(233, 30, 99, 0.08));
            }

            .curtain-right {
                animation: curtainSlideInRight 1.8s ease-out 0.5s forwards,
                          mobileCurtainShadowFadeRight 1.5s ease-out 2.3s forwards;
                box-shadow: -8px 0 16px rgba(233, 30, 99, 0.12);
                filter: drop-shadow(-6px 0 12px rgba(233, 30, 99, 0.08));
            }
        }

        @keyframes mobileCurtainShadowFadeLeft {
            0% {
                box-shadow: 8px 0 16px rgba(233, 30, 99, 0.12);
                filter: drop-shadow(6px 0 12px rgba(233, 30, 99, 0.08));
            }
            100% {
                box-shadow: 2px 0 6px rgba(233, 30, 99, 0.02);
                filter: drop-shadow(1px 0 3px rgba(233, 30, 99, 0.01));
            }
        }

        @keyframes mobileCurtainShadowFadeRight {
            0% {
                box-shadow: -8px 0 16px rgba(233, 30, 99, 0.12);
                filter: drop-shadow(-6px 0 12px rgba(233, 30, 99, 0.08));
            }
            100% {
                box-shadow: -2px 0 6px rgba(233, 30, 99, 0.02);
                filter: drop-shadow(-1px 0 3px rgba(233, 30, 99, 0.01));
            }
        }

        @media (max-width: 480px) {
            .main-content {
                gap: clamp(0.85rem, 3.1dvh, 1.35rem);
                padding:
                    calc(clamp(0.9rem, 4.5dvh, 2rem) + env(safe-area-inset-top, 0px))
                    0
                    calc(clamp(0.9rem, 4.5dvh, 2rem) + env(safe-area-inset-bottom, 0px));
            }

            .text-center {
                width: min(300px, calc(100vw - 56px));
                max-width: calc(100vw - 56px);
                padding: 1.55rem 0.95rem;
            }

            .brand-logo {
                margin-bottom: 0.85rem;
            }

            .logo-line {
                min-height: 30px;
                padding: 0 14px;
                font-size: 0.68rem;
                letter-spacing: 0.11em;
            }

            .coming-soon {
                font-size: 3.25rem;
                margin-bottom: 0.72rem;
            }

            .subtitle {
                font-size: 0.95rem;
            }

            .blur-1, .blur-2 {
                width: 16rem;
                height: 16rem;
            }

            .footer {
                margin-top: clamp(2.4rem, 12dvh, 5.25rem);
                padding: 0 1rem;
            }

            .divider {
                align-items: center;
                flex-direction: column;
                gap: 0.38rem;
                margin-top: 1.15rem;
            }

            .divider-line {
                width: 4.5rem;
            }

            .divider-dot {
                max-width: 12rem;
                font-size: 0.78rem;
                line-height: 1.25;
            }

            .contact-card {
                width: min(286px, calc(100vw - 56px));
                max-width: calc(100vw - 56px);
                padding: 0.52rem 0.58rem;
            }

            .contact-info {
                gap: 0.45rem;
            }

            .contact-text {
                font-size: 0.8rem;
            }

            .contact-link {
                min-height: 32px;
                padding: 0 0.72rem;
                font-size: 0.88rem;
            }

            .float-bubble:nth-child(2),
            .float-bubble:nth-child(7) {

        }

        @media (max-width: 360px) {

            }

            }

            .divider-dot {

        @media (max-width: 480px) and (max-height: 680px) {

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.001ms !important;
                animation-delay: 0s !important;

            .text-center::before,

    <div class="container">

        <!-- Decorative background elements -->
        <div class="blur-1"></div>
        <div class="blur-2"></div>
        <div class="bubble-field" aria-hidden="true">
            <span class="float-bubble"></span>
            <span class="float-bubble"></span>
            <span class="float-bubble"></span>
            <span class="float-bubble"></span>
            <span class="float-bubble"></span>
            <span class="float-bubble"></span>
            <span class="float-bubble"></span>
            <span class="float-bubble"></span>
        </div>

        <!-- Main content area -->
        <div class="main-content">
            <div class="center-content">
                <div class="text-center">
                    <!-- Brand/Logo area -->
                    <div class="brand-logo">
                        <div class="logo-line">shop opening soon</div>
                    </div>

                    <!-- Coming Soon Message -->
                    <h1 class="coming-soon">Dolliest</h1>

                    <!-- Subtitle -->
                    <p class="subtitle" aria-label="heart">♡</p>

                        <div class="divider-dot">Dolliest.com is open to offers</div>
                        <div class="divider-line"></div>
                    </div>
                </div>
            </div>

            <!-- Contact Information Footer -->
            <footer class="footer">
                <div class="contact-card">
                    <div class="contact-info">
                        <span class="contact-text">contact / inquiries</span>
                        <a href="https://www.instagram.com/pawswirl/"
                           target="_blank"
                           rel="noopener noreferrer"
                           class="contact-link"
                           id="instagram-link">
                            @pawswirl
                        </a>
                    </div>
                </div>
            </footer>
        </div>
    </div>

    <audio id="handle-sound" src="cut2.mp3" preload="auto"></audio>

    <script>
        // Performance optimizations and hardware acceleration
        document.addEventListener('DOMContentLoaded', function() {
            const elements = document.querySelectorAll('.curtain-left, .curtain-right');
            elements.forEach(el => {
                el.style.willChange = 'transform, opacity';
                el.style.backfaceVisibility = 'hidden';
                el.style.perspective = '1000px';
                el.style.transform = 'translateZ(0)';
            });

            setTimeout(() => {
                elements.forEach(el => {
                    el.style.willChange = 'auto';
                });
            }, 5000);
        });

        const instagramLink = document.getElementById('instagram-link');
        const handleSound = document.getElementById('handle-sound');

        if (instagramLink && handleSound) {
            let lastPlay = 0;
            const playHandleSound = () => {
                const now = Date.now();
                if (now - lastPlay < 250) return;
                lastPlay = now;
                handleSound.currentTime = 0;
                handleSound.play().catch(() => {});
            };

            instagramLink.addEventListener('pointerdown', playHandleSound);
            instagramLink.addEventListener('click', playHandleSound);
        }
    </script>
    <script data-goatcounter="https://dolliest.goatcounter.com/count"
            async src="//gc.zgo.at/count.js"></script>
